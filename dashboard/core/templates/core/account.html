{% extends "core/base.html" %}{% block body %}<section><h2>Account</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post">{% csrf_token %}<input type="hidden" name="action" value="password">
<label>New password (15 or more characters) <input name="new_password" type="password" autocomplete="new-password"></label><button>Change password</button></form>
<hr><form method="post">{% csrf_token %}<input type="hidden" name="action" value="recovery_codes"><button>Replace recovery codes</button></form>
<hr><form method="post">{% csrf_token %}<input type="hidden" name="action" value="sign_out_everywhere"><button>Sign out everywhere</button></form></section>{% endblock %}
